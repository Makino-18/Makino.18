<html>

    <body>
        <div class="header">
            <h1 class="h1_margin">实验室</h1>
        </div>
        
        <div id="nav-placeholder"></div>
        
        <div>
            <p class="p_margin">上次刷新时间：<time id="current-time"></time></p>
                <script>
                    document.addEventListener('DOMContentLoaded', (event) => {
                    const timeElement = document.getElementById('current-time');
                    const now = new Date();
                    timeElement.textContent = now.toLocaleString();
                    timeElement.setAttribute('datetime', now.toISOString());
                });
                </script>
        </div>
        
        <div class="logcard" style="background-color:rgba(122,189,208,1.00)">
            <p style="float:left">网站页脚系统测试</p>

            <a style="float:right"><button class="testbutton">已关闭</button></a>
        </div>

    </body>
</html>
